<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
        <div class="header-left">
            <div class="logo-icon"></div>
            <div class="site-title">STUDENT HUB</div>
        </div>
        <nav>
            <ul id="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="faqs.html">FAQs</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>
  <h2>Student Registration Form</h2>
  <form id="registrationForm">
    <div>
      <label for="name">Full Name:</label>
      <input type="text" id="name" placeholder="Enter your name" required>
      <span class="error" id="nameError"></span>
    </div>

    <div>
      <label for="email">Email:</label>
      <input type="email" id="email" placeholder="Enter your Email"required>
      <span class="error" id="emailError"></span>
    </div>

    <div>
      <label for="mobile">Mobile Number:</label>
      <input type="tel" id="mobile" placeholder="Enter your mobile" required>
      <span class="error" id="mobileError"></span>
    </div>

    <div>
      <label for="password">Password:</label>
      <input type="password" id="password" placeholder="Enter your password"required>
      <span class="error" id="passwordError"></span>
    </div>

    <div>
      <label for="confirmPassword">Confirm Password:</label>
      <input type="password" id="confirmPassword" placeholder="Enter your confirm password"required>
      <span class="error" id="confirmPasswordError"></span>
    </div>

    <div>
      <label for="course">Course:</label>
      <select id="course" required>
        <option value="">Select Course</option>
        <option value="B.Tech">B.Tech</option>
        <option value="M.Tech">M.Tech</option>
        <option value="MBA">MBA</option>
      </select>
      <span class="error" id="courseError"></span>
    </div>

    <div>
      <label for="year">Year:</label>
      <select id="year" required>
        <option value="">Select Year</option>
        <option value="1">1st Year</option>
        <option value="2">2nd Year</option>
        <option value="3">3rd Year</option>
        <option value="4">4th Year</option>
      </select>
      <span class="error" id="yearError"></span>
    </div>

    <div>
      <label>Gender:</label>
      <input type="radio" name="gender" value="Male" required> Male
      <input type="radio" name="gender" value="Female"> Female
      <input type="radio" name="gender" value="Other"> Other
      <span class="error" id="genderError"></span>
    </div>

    <div>
      <input type="checkbox" id="terms" required> I accept the terms & conditions
      <span class="error" id="termsError"></span>
    </div>

    <button type="submit">Register</button>
    <div class="registration-login">
    <p>Already have an account?</p>
    <a href="login.html">Login</a>
    </div>
  </form>

  <script src="validation.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Secure Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="registration.css">
</head>
<body>

<header>
    <div class="header-left">
        <div class="logo-icon"></div>
        <div class="site-title">STUDENT HUB</div>
    </div>
    <nav>
        <ul id="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="faqs.html">FAQs</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>
</header>

<div class="login-container">
    <div class="login-box">
        <h2>Student Login</h2>
        <p class="subtitle">Welcome back! Please login to your account</p>
        
        <div id="loginAlert" style="display:none;"></div>
        
        <form id="loginForm" action="login.php" method="POST" novalidate>
            <div class="form-group">
                <label for="email">Email Address or Student Number *</label>
                <input type="text" id="email" name="email" 
                       placeholder="e.g., student@example.com or STU001" required>
                <span class="error-message" id="email_error"></span>
            </div>
            
            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" 
                       placeholder="Enter your password" required>
                <span class="error-message" id="password_error"></span>
            </div>
            
            <div class="form-group">
                <label>
                    <input type="checkbox" id="remember" name="remember">
                    Remember me
                </label>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn btn-primary" id="submitBtn">Login</button>
                <button type="reset" class="btn btn-secondary">Clear</button>
            </div>
        </form>
        
        <p class="register-link">
            Don't have an account? <a href="register.html">Register here</a>
        </p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const urlParams = new URLSearchParams(window.location.search);
    const error = urlParams.get('error');
    const message = urlParams.get('message');
    const registered = urlParams.get('registered') || urlParams.get('status');
    const alertBox = document.getElementById('loginAlert');
    
    if (alertBox) {
        if (registered === '1' || registered === 'success') {
            alertBox.style.display = 'block';
            alertBox.className = 'alert alert-success';
            alertBox.textContent = 'Registration successful! You can now log in with your credentials.';
        } else if (error) {
            alertBox.style.display = 'block';
            alertBox.className = 'alert alert-error';
            alertBox.textContent = message ? decodeURIComponent(message) : 'Invalid email/username or password. Please try again.';
        }
    }
});
</script>
</body>
</html>
